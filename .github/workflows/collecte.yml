# Collecte Open-Meteo — 2 créneaux par jour : 6h15 et 18h15 Europe/Paris, été
# comme hiver. Un cron UTC ne suit pas l'heure d'été : on en pose deux par
# créneau, 4h28 et 5h28 UTC le matin, 16h28 et 17h28 le soir. Selon la saison,
# l'un tombe à 6h28 / 18h28 à Paris et fait la collecte, l'autre tombe une heure
# à côté et ne trouve que le créneau déjà collecté, donc ne fait rien.
#
# Le cron part à :28 plutôt qu'à l'heure pile, où GitHub est le plus chargé ;
# il peut quand même arriver avec plusieurs heures de retard. Un run en retard
# est rattaché au dernier créneau ouvert et le collecte quand même.
# Le cron GitHub ne part que depuis la branche par défaut (main).
name: Collecte Open-Meteo

"on":
  schedule:
    - cron: "28 4,5,16,17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le filtre des créneaux déjà collectés"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: collecte-api-meteo

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Extraire les prévisions
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -u src/collecte/run.py --force
          else
            python -u src/collecte/run.py
          fi

      - name: Committer les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle à committer."
            exit 0
          fi
          git commit -m "Collecte Open-Meteo $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:collecte-api-meteo

      # Un créneau sauté reste vert et le traitement republie les mêmes bruts :
      # sans cette alerte, le site paraît frais avec des jours de retard.
      - name: Alerter si les bruts sont périmés
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/raw/last_update.json")
          if not path.exists():
              print("::warning title=Bruts absents::data/raw/last_update.json introuvable.")
              raise SystemExit(0)
          stamp = json.loads(path.read_text(encoding="utf-8"))["last_update_at"]
          age_h = (datetime.now(timezone.utc) - datetime.fromisoformat(stamp)).total_seconds() / 3600
          if age_h > 24:
              print(
                  f"::warning title=Previsions perimees::Derniere collecte reussie "
                  f"il y a {age_h:.0f} h ({stamp})."
              )
          else:
              print(f"Bruts a jour : derniere collecte il y a {age_h:.1f} h ({stamp}).")
          PY
