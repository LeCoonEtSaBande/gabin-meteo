# Archive à 1 h du matin (Europe/Paris) la prévision AROME HD / ICON-CH1 pour la
# journée qui commence, telle qu'on la voyait la veille au soir.
#
# 23:05 UTC tombe à 1h05 en été et 0h05 en hiver : dans les deux cas la journée
# de Paris visée est la bonne. Les trois autres déclenchements retombent sur un
# jour déjà archivé et ne font rien, sauf rattraper un passage échoué.
#
# L'heure réelle du run n'a aucune influence : le script prend la dernière
# collecte lancée avant minuit du jour archivé, donc un cron en retard de
# plusieurs heures produit exactement le même fichier. Aucun appel API, tout se
# lit dans l'historique de collecte-api-meteo (fetch-depth = HISTORY_DEPTH).
name: Archive des prévisions de 1 h

"on":
  schedule:
    - cron: "5 23,0,2,4 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Jour prévu à archiver (AAAA-MM-JJ). Vide : la journée de Paris en cours"
        type: string
        default: ""
      force:
        description: "Réécrire le jour s'il est déjà archivé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-previsions
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout archive-previsions
        uses: actions/checkout@v7
        with:
          ref: archive-previsions

      - name: Checkout de l'historique de collecte
        uses: actions/checkout@v7
        with:
          ref: collecte-api-meteo
          path: _collecte
          fetch-depth: 120

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Archiver
        env:
          DAY: ${{ inputs.day }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--collecte _collecte)
          if [ -n "$DAY" ]; then args+=(--day "$DAY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -u src/archive/run.py "${args[@]}"

      - name: Committer l'archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive index.md
          if git diff --cached --quiet; then
            echo "Archive déjà à jour."
            exit 0
          fi
          git commit -m "Archive prévisions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:archive-previsions
