# Archive les mesures des balises de la journée de Paris écoulée, sur la branche
# `balises`. Une seule écriture par jour, à 1 h du matin : la journée est
# terminée, donc complète du premier coup. Pas de pose partielle le soir ni de
# clôture le lendemain.
#
# 23:10 UTC tombe à 1h10 en été et 0h10 en hiver ; dans les deux cas la veille
# parisienne est close. Les quatre autres déclenchements trouvent un jour déjà
# archivé et ne font rien, sauf rattraper un passage échoué.
#
# Partir tôt n'est pas qu'une question d'habitude : le paquet Météo-France ne
# remonte que 24 h glissantes, donc chaque heure de retard laisse quelques
# créneaux à rattraper en appels unitaires. Le script s'en charge seul, le run
# dure simplement un peu plus longtemps.
#
# Les balises viennent de la fiche d'`affichage-web` : en ajouter une, ou changer
# son pas fin, n'y demande que sa ligne.
name: Archive des balises

"on":
  schedule:
    - cron: "10 23,0,1,2,3 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Jour à archiver (AAAA-MM-JJ). Vide : la journée de Paris écoulée"
        type: string
        default: ""
      force:
        description: "Réécrire un jour déjà archivé"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-balises
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout balises
        uses: actions/checkout@v7
        with:
          ref: balises

      - name: Checkout de la fiche des balises
        uses: actions/checkout@v7
        with:
          ref: affichage-web
          path: _web
          sparse-checkout: assets/balises_specs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Archiver
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
          DAY: ${{ inputs.day }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--specs _web/assets/balises_specs/balises_specifications.csv)
          if [ -n "$DAY" ]; then args+=(--day "$DAY"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python -u src/archive/run.py "${args[@]}"

      - name: Committer l'archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive index.md
          if git diff --cached --quiet; then
            echo "Archive déjà à jour."
            exit 0
          fi
          git commit -m "Archive balises $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:balises
