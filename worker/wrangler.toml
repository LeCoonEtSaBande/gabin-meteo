name = "gabin-meteo"
main = "src/index.js"
compatibility_date = "2026-10-11"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[vars]
# Fiches des balises : branche affichage-web, lue en direct (pas de seconde table).
SPECS_URL = "https://raw.githubusercontent.com/LeCoonEtSaBande/gabin-meteo/affichage-web/assets/balises_specs/balises_specifications.csv"
# Origines autorisées en plus de localhost / 127.0.0.1, séparées par des virgules.
ALLOWED_ORIGINS = "https://lecoonetsabande.github.io"
# Cache de bord de /balises, en secondes.
CACHE_SECONDS = "180"
SPECS_CACHE_SECONDS = "600"
# Paquet de 24 h au pas de 6 min, un appel par balise : c'est la source normale
# de la courbe française. DPObs ne sert plus que de repli pour la vignette.
METEOFRANCE_PAQUET_BASE = "https://public-api.meteofrance.fr/public/DPPaquetObs/v1"
METEOFRANCE_BASE = "https://public-api.meteofrance.fr/public/DPObs/v2"
# Pas commun renvoyé au navigateur. 30 minutes est le seul pas qui tombe juste
# à la fois sur les 6 min de Météo-France et les 10 min de MétéoSuisse : décimer
# ne déplace aucune mesure. Les balises qui méritent mieux portent un pas fin
# dans la fiche (`pas_fin_min`), pas ici.
COARSE_STEP_MIN = "30"

# La clé Météo-France n'est pas ici : `wrangler secret put METEOFRANCE_API_KEY`.
